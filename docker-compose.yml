services:
  ml-service:
    image: credit-default-api:latest
    build: .
    container_name: credit-default-api-compose
    ports:
      - "5000:5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: credit-default-nginx-compose
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ml-service
    restart: unless-stopped
